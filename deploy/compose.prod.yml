# CinePro Core — production stack for the Dokploy host.
# Owned by CI (.github/workflows/build-deploy.yml): it substitutes the
# placeholder token in this file with ghcr.io/shrijit37/cinepro-core:<full-sha>
# and pushes the result to Dokploy through compose.update. Never hand-edit the
# image tag in Dokploy — the pipeline owns that field.
#
# deployed-build: __IMAGE__
services:
  cinepro-core:
    image: __IMAGE__
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - dokploy-network

  # Mints the YouTube PoTokens that yt-dlp needs for /v1/youtube/*: from this
  # host YouTube answers the player request with "Sign in to confirm you're not
  # a bot" and hands out throttled media URLs. Upstream's server image is
  # pinned by tag; Core reaches it as http://bgutil-provider:4416 (YTDLP_POT_URL
  # overrides, empty disables). No published port — same network only.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    restart: unless-stopped
    networks:
      dokploy-network:
        aliases:
          - bgutil-provider

  # cinepro-lane-egress: one Cloudflare WARP egress per lane, each lane an HTTP
  # CONNECT proxy on :800N inside this container, plus a control plane on :9100.
  # Core reaches lane N as http://cinepro-lane-egress:800N through YTDLP_PROXY.
  #
  # The service name is deliberately not `lane-egress`: the ccMesh stack runs
  # the same sidecar under that name on this host, and while both were on
  # dokploy-network Docker's DNS answered `lane-egress` with *both* containers.
  # Core then streamed through another stack's sidecar (its control plane
  # answered 401 for this stack's token) and this stack's own lanes carried
  # nothing. A unique service name makes the target unambiguous.
  #
  # WHY THIS EXISTS. This host's own egress (130.210.29.215, OCI ap-mumbai-1,
  # AS31898) is bot-checked by YouTube for every yt-dlp client family, so
  # /v1/youtube/*?audio=1 answered 502 for the music ids while the same clients
  # resolved the same ids from a residential line and from WARP. A PoToken was
  # measured not to be the lever (the provider only serves the webpo clients,
  # which this IP also bot-checks): the failing axis is egress reputation.
  #
  # Pinned by digest, like the ccMesh stack pins it: a tag would let an upstream
  # rebuild swap the sidecar under a Core-only deploy and force a lane
  # re-provision. Source is shrijit37/meshcode container/lane-egress — rebuild
  # deliberately, then update this digest. Warp mode is userspace (xray →
  # WireGuard), so no cap_add, no /dev/net/tun, no ip_forward.
  #
  # NEVER read the control plane's lane state as YouTube health: lane_ctl's
  # boot/rotation probes are opencode *zen* surfaces (PROBE_SURFACES below), so
  # a lane can read degraded there while serving YouTube fine, and vice versa.
  # The only authoritative test is a real resolve through the lane.
  cinepro-lane-egress:
    image: ghcr.io/shrijit37/meshcode-lane-egress@sha256:37c6dbd793a2e2891262ab6fb3897b72556447d75f984ab0c54f6d68b49ec8d1
    environment:
      # Bearer token for the :9100 control plane (status / rotate / run_cmd).
      # Baked into this stack's .env by CI from Doppler platform/prd
      # CINEPRO_LANE_TOKEN — it authenticates inside this stack only and is not
      # a credential for anything outside it. No published port either: the
      # sidecar is reachable on dokploy-network only.
      LANE_TOKEN: ${LANE_TOKEN:?LANE_TOKEN must be set in the compose env}
      LANE_MODE: warp
      # Four lanes, eight WARP accounts: boot brings up max(pool, lanes*2).
      # Measured with two lanes: the bot check is per WARP address, not per
      # client — one music id resolved through 8002 after 8001 refused it, so
      # more accounts is the lever that costs nothing but memory.
      LANES: "8001,8002,8003,8004"
      WARP_POOL_SIZE: "8"
      PROBE_SURFACES: "chat"
      ZEN_PROBE_TIMEOUT: "12"
    restart: unless-stopped
    volumes:
      # Pool + per-lane account pointers: without it every recreate registers a
      # fresh set of WARP accounts (paced, and wasteful).
      - lane-state:/var/lib/lane-egress
    networks:
      dokploy-network:
        aliases:
          - cinepro-lane-egress

volumes:
  lane-state:

networks:
  dokploy-network:
    external: true
