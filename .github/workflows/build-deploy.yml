name: build-deploy

# Build CinePro Core, publish the image to GHCR, pin it in the Dokploy compose
# app, roll that app, then gate on: the running build reports this commit's SHA,
# anonymous callers are refused (Traefik basic auth on the router), and a real
# resolve still returns sources.
#
# Nothing is built on the server: Dokploy pulls the SHA-tagged image. The
# compose app is a *compose* app and not a Dokploy *application* because on this
# Dokploy build (v0.30.8) an application created from a git source cannot be
# made to pull a CI image — `application.saveDockerProvider` returns true while
# the deploy still runs a source build. See DEPLOY.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-deploy-main
  cancel-in-progress: false

env:
  APP_URL: https://cinepro-core.shrijit.tech
  DOKPLOY_URL: ${{ vars.DOKPLOY_URL || 'https://manage.shrijit.tech' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx prettier --check src

  build:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Both platforms: the Dokploy host is linux/arm64.
          platforms: linux/amd64,linux/arm64
          push: true
          # Attestations off (as upstream's own release workflow does): they add
          # manifest pushes this deploy never reads, and a GHCR hiccup on them
          # stalls the whole build instead of failing it.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=cinepro-core
          cache-to: type=gha,mode=max,scope=cinepro-core
          # APP_VERSION is what /v1/health reports as `version`; the gate below
          # asserts it, so a stale container can never pass as this build.
          build-args: |
            APP_VERSION=${{ github.sha }}
            REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read app secrets from Doppler (platform/prd)
        uses: dopplerhq/cli-action@v4
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Load secrets
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          # One download, then read the two keys this pipeline needs. The TMDB
          # key is the service's own credential; the basic-auth credential is
          # what the Traefik middleware was built from.
          doppler secrets download --no-file --format json --silent > /tmp/doppler.json
          TMDB=$(jq -r '.CINEPRO_TMDB_API_KEY // empty' /tmp/doppler.json)
          AUTH=$(jq -r '.CINEPRO_CORE_BASIC_AUTH // empty' /tmp/doppler.json)
          LANE=$(jq -r '.CINEPRO_LANE_TOKEN // empty' /tmp/doppler.json)
          if [ -z "$TMDB" ]; then
            echo "::error::CINEPRO_TMDB_API_KEY is empty in Doppler platform/prd — refusing to deploy a Core that cannot resolve anything"
            exit 1
          fi
          if [ -z "$AUTH" ]; then
            echo "::error::CINEPRO_CORE_BASIC_AUTH is empty in Doppler platform/prd — the auth gate cannot run"
            exit 1
          fi
          if [ -z "$LANE" ]; then
            echo "::error::CINEPRO_LANE_TOKEN is empty in Doppler platform/prd — the lane-egress sidecar refuses to boot without it (LANE_TOKEN required)"
            exit 1
          fi
          echo "::add-mask::$TMDB"
          echo "::add-mask::$AUTH"
          echo "::add-mask::$LANE"
          {
            echo "TMDB_API_KEY=$TMDB"
            echo "BASIC_AUTH=$AUTH"
            echo "LANE_TOKEN=$LANE"
          } >> "$GITHUB_ENV"
          rm -f /tmp/doppler.json
          echo "loaded ${{ github.repository }} app secrets from Doppler platform/prd"

      - name: Re-assert the domain and its auth middleware
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOMAIN_ID: ${{ vars.DOKPLOY_DOMAIN_ID }}
        run: |
          set -euo pipefail
          if [ -z "${DOMAIN_ID:-}" ]; then
            echo "::error::repo variable DOKPLOY_DOMAIN_ID is not set"
            exit 1
          fi
          # Auth is the whole point: a hand-edited domain that dropped the
          # middleware would reopen /v1/proxy to anyone. The name must carry
          # `@file` — Dokploy injects this list verbatim into the router label
          # and the middleware is defined in the file provider, so an
          # unqualified name makes Traefik drop the router and every request
          # 404s.
          curl -fsS -X POST "$DOKPLOY_URL/api/domain.update" \
            -H "x-api-key: $DOKPLOY_API_KEY" -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg id "$DOMAIN_ID" '{domainId: $id, host: "cinepro-core.shrijit.tech", port: 3210, https: true, certificateType: "letsencrypt", serviceName: "cinepro-core", middlewares: ["cinepro-core-auth@file"]}')" >/dev/null
          echo "domain re-asserted: cinepro-core.shrijit.tech -> cinepro-core:3210 with cinepro-core-auth@file"

      - name: Pin the compose app to this build
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${COMPOSE_ID:-}" ]; then
            echo "::error::repo variable DOKPLOY_COMPOSE_ID is not set"
            exit 1
          fi
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          # deploy/compose.prod.yml is the single source of truth; __IMAGE__ is
          # the only thing substituted. Dokploy's stored copy is pipeline-owned.
          jq -n --rawfile compose deploy/compose.prod.yml --arg img "$IMAGE" \
            '$compose | gsub("__IMAGE__"; $img)' --raw-output > /tmp/compose.yml
          jq -nc --arg id "$COMPOSE_ID" --rawfile file /tmp/compose.yml \
            '{composeId: $id, composeFile: $file}' > /tmp/payload.json
          curl -fsS -X POST "$DOKPLOY_URL/api/compose.update" \
            -H "x-api-key: $DOKPLOY_API_KEY" -H 'Content-Type: application/json' \
            -d @/tmp/payload.json >/dev/null
          echo "compose file pinned to $IMAGE"

      - name: Re-assert the app env
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
        run: |
          set -euo pipefail
          # Dokploy's provider sync can clear an app's env block, so it is
          # re-asserted from deploy/app.env on every deploy. No secret is in
          # that file: __TMDB_API_KEY__ and __LANE_TOKEN__ are substituted from
          # Doppler here.
          jq -n --rawfile env deploy/app.env --arg key "$TMDB_API_KEY" \
            --arg lane "$LANE_TOKEN" \
            '$env | gsub("__TMDB_API_KEY__"; $key) | gsub("__LANE_TOKEN__"; $lane)' \
            --raw-output > /tmp/app.env
          jq -nc --arg id "$COMPOSE_ID" --rawfile env /tmp/app.env \
            '{composeId: $id, env: $env, createEnvFile: true}' > /tmp/payload.json
          curl -fsS -X POST "$DOKPLOY_URL/api/compose.saveEnvironment" \
            -H "x-api-key: $DOKPLOY_API_KEY" -H 'Content-Type: application/json' \
            -d @/tmp/payload.json >/dev/null
          echo "app env re-asserted ($(grep -c '=' /tmp/app.env) keys)"
          rm -f /tmp/app.env /tmp/payload.json

      - name: Roll the compose app
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
        run: |
          set -euo pipefail
          # compose.deploy pulls the pinned image and recreates the container.
          # (`application.redeploy` is the call that silently no-ops; this is a
          # compose app, so compose.deploy is the roll.)
          curl -fsS -X POST "$DOKPLOY_URL/api/compose.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg id "$COMPOSE_ID" --arg title "CI ${GITHUB_SHA:0:7}" '{composeId: $id, title: $title}')"

      - name: Gate 1 — the running build is this SHA
        run: |
          set -euo pipefail
          # 600s: Let's Encrypt issues on first deploy, and the previous
          # container keeps answering while the new one starts — so liveness
          # alone proves nothing and the loop must require THIS sha.
          deadline=$((SECONDS + 600))
          while [ $SECONDS -lt $deadline ]; do
            body=$(curl -fsS --max-time 15 -u "$BASIC_AUTH" "$APP_URL/v1/health" || true)
            version=""
            [ -n "${body:-}" ] && version=$(printf '%s' "$body" | jq -r '.version // empty' 2>/dev/null || true)
            if [ "$version" = "$GITHUB_SHA" ]; then
              echo "health reports $version — gate passed"
              echo "anonymous /v1/health -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$APP_URL/v1/health")"
              exit 0
            fi
            echo "waiting: health version=${version:-<none>} want=$GITHUB_SHA"
            sleep 8
          done
          echo "::error::gate failed — $APP_URL/v1/health never reported $GITHUB_SHA"
          exit 1

      - name: Gate 2 — anonymous access is refused, authenticated resolve works
        run: |
          set -euo pipefail
          fail=0
          for path in /v1/health /v1/movies/550 "/v1/proxy?data=x"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$APP_URL$path" || true)
            echo "anonymous $path -> $code"
            [ "$code" = "401" ] || { echo "::error::anonymous $path returned $code, expected 401"; fail=1; }
          done
          [ "$fail" = "0" ] || exit 1
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -u "$BASIC_AUTH" "$APP_URL/v1/health")
          echo "authenticated /v1/health -> $code"
          [ "$code" = "200" ] || { echo "::error::authenticated health returned $code"; exit 1; }
          # The resolve is the point of the service: providers are third-party
          # and slow, so this one gets a long deadline. VidApi — the only
          # provider still returning anything — swings between 0.4 s and more
          # than a minute for the same title, and a resolve that loses that
          # window answers NO_SOURCES_AVAILABLE, so 180 s was too tight.
          deadline=$((SECONDS + 420))
          while [ $SECONDS -lt $deadline ]; do
            body=$(curl -fsS --max-time 120 -u "$BASIC_AUTH" "$APP_URL/v1/movies/550" || true)
            # Not a here-string: jq mis-parses a 20 KB body fed that way and
            # exits non-zero while still printing the count, so the `|| 0`
            # fallback would concatenate "3\n0" and break the numeric test.
            count=0
            if [ -n "${body:-}" ]; then
              count=$(printf '%s' "$body" | jq -r '(.sources // []) | length' 2>/dev/null) || count=0
            fi
            case "$count" in ''|*[!0-9]*) count=0 ;; esac
            if [ "$count" -gt 0 ]; then
              echo "authenticated /v1/movies/550 -> $count source(s)"
              printf '%s' "$body" | jq -r '.sources[] | "  \(.quality) \(.provider.name // .provider.id) (\(.type))"'
              exit 0
            fi
            echo "resolve returned $count sources, retrying"
            sleep 10
          done
          echo "::error::gate failed — /v1/movies/550 returned no sources"
          exit 1

      - name: Gate 3 — the resolved source actually serves media
        run: |
          set -euo pipefail
          # Resolving is not the product, playback is. A provider can hand back
          # an HLS master whose entries are HTML pages: VidApi did exactly that
          # (three 1080p sources, every segment a `page-N.html` answering 403)
          # because the iframe Referer it sent tripped the CDN's hotlink rule.
          # Walk the chain the player walks and require real MPEG-TS bytes.
          abs() { case "$1" in http*) printf '%s' "$1" ;; *) printf '%s%s' "$APP_URL" "$1" ;; esac; }
          body=$(curl -fsS --max-time 120 -u "$BASIC_AUTH" "$APP_URL/v1/movies/550")
          master=$(printf '%s' "$body" | jq -r '.sources[0].url // empty')
          [ -n "$master" ] || { echo "::error::/v1/movies/550 returned no source URL"; exit 1; }
          echo "source: ${master:0:110}…"
          # Playlists go to files: piping 700 KB into `head -1` closes the pipe
          # early and `pipefail` turns the SIGPIPE into a failed gate.
          curl -fsS --max-time 60 -u "$BASIC_AUTH" "$(abs "$master")" -o master.m3u8
          variant=$(awk '!/^#/ && NF { print; exit }' master.m3u8)
          [ -n "$variant" ] || { echo "::error::master playlist listed no variants"; exit 1; }
          echo "variant: ${variant:0:110}…"
          curl -fsS --max-time 60 -u "$BASIC_AUTH" "$(abs "$variant")" -o media.m3u8
          segment=$(awk '!/^#/ && NF { print; exit }' media.m3u8)
          [ -n "$segment" ] || { echo "::error::media playlist listed no segments"; exit 1; }
          echo "segment: ${segment:0:110}…"
          code=$(curl -s -o seg.bin -w '%{http_code}' --max-time 90 -u "$BASIC_AUTH" "$(abs "$segment")")
          size=$(wc -c < seg.bin)
          first=$(head -c 1 seg.bin | od -An -tx1 | tr -d ' \n')
          echo "first segment -> HTTP $code, $size bytes, first byte 0x$first"
          [ "$code" = "200" ] || { echo "::error::first segment returned HTTP $code"; exit 1; }
          [ "$size" -gt 100000 ] || { echo "::error::first segment is only $size bytes — not media"; exit 1; }
          [ "$first" = "47" ] || { echo "::error::first segment does not start with the MPEG-TS sync byte (0x47) — the playlist is not media"; exit 1; }

      - name: Gate 4 — YouTube media streams with ranges
        run: |
          set -euo pipefail
          # The TV cannot fetch googlevideo: unattested URLs are throttled to
          # bounded sub-megabyte ranges (403 past that, 403 on an open-ended
          # range). So Core must mint the URL with yt-dlp AND stream the bytes
          # itself, honouring Range. This gate is the only thing standing
          # between a yt-dlp regression and a silent "no playback".
          #
          # It is also the egress gate. When the resolver's own egress IP is
          # bot-checked by YouTube, every client family answers "Sign in to
          # confirm you're not a bot" and the music ids below answer 502 —
          # which is how this whole endpoint came to be broken while a deploy
          # was green. A run of this step is therefore the acceptance test for
          # "YouTube audio works", not just for "the container is up".
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$APP_URL/v1/youtube/dQw4w9WgXcQ")
          echo "anonymous /v1/youtube/dQw4w9WgXcQ -> $code"
          [ "$code" = "401" ] || { echo "::error::anonymous YouTube endpoint returned $code, expected 401"; exit 1; }

          # Lane sidecar reachability — diagnostic only. The lane control plane
          # speaks plain HTTP on dokploy-network, so Core's /v1/proxy can reach
          # it, which proves the service is up and that `lane-egress` resolves
          # from inside the Core container. It does NOT prove YouTube works
          # through a lane: lane-ctl's probes are opencode zen surfaces, not
          # YouTube health (`deploy/compose.prod.yml`). The loop below is the
          # authority; this line just says which of the two broke.
          data=$(jq -rn --arg u 'http://lane-egress:9100/v1/status?port=all' \
            --arg t "Bearer $LANE_TOKEN" '{url:$u,headers:{Authorization:$t}}|@uri')
          lane_code=$(curl -s -o lane.json -w '%{http_code}' --max-time 30 \
            -u "$BASIC_AUTH" "$APP_URL/v1/proxy?data=$data" || true)
          echo "lane control plane via /v1/proxy -> HTTP $lane_code"
          if [ "$lane_code" = "200" ]; then
            jq -r '(.lanes // [])[] | "  lane \(.port) state=\(.state) ip=\(.curr_ip // "?")"' lane.json || true
          else
            head -c 300 lane.json || true
            echo
          fi

          body() { printf '%s' "$(head -c 400 "$1" 2>/dev/null || true)" | tr -d '\r'; }

          # $1 = id, $2 = query suffix ('' or '?audio=1'), $3 = expected box at
          # byte 4 ('' = do not assert). Exercises the three shapes the player
          # uses: a megabyte at the start, a 1 KiB head range, and a mid-file
          # range derived from the total the server reports.
          check_stream() {
            local id=$1 suffix=$2 want_brand=$3 code size total half end brand
            local url="$APP_URL/v1/youtube/$id$suffix"
            code=$(curl -s -D yt_headers.txt -o yt_first.bin -w '%{http_code}' --max-time 180 \
              -u "$BASIC_AUTH" -H 'Range: bytes=0-1048575' "$url")
            size=$(wc -c < yt_first.bin)
            total=$(grep -i '^content-range:' yt_headers.txt | tr -d '\r' | sed -E 's#.*/##')
            echo "  $id$suffix  range 0-1048575 -> HTTP $code, $size bytes, total ${total:-?}"
            [ "$code" = "206" ] || { echo "::error::$id$suffix: expected 206, got $code: $(body yt_first.bin)"; return 1; }
            [ "$size" = "1048576" ] || { echo "::error::$id$suffix: expected 1048576 bytes, got $size"; return 1; }
            case "$total" in ''|*[!0-9]*) echo "::error::$id$suffix: no usable Content-Range total"; return 1 ;; esac

            code=$(curl -s -o yt_small.bin -w '%{http_code}' --max-time 180 \
              -u "$BASIC_AUTH" -H 'Range: bytes=0-1023' "$url")
            size=$(wc -c < yt_small.bin)
            brand=$(dd if=yt_small.bin bs=1 skip=4 count=4 2>/dev/null || true)
            echo "  $id$suffix  range 0-1023 -> HTTP $code, $size bytes, brand '$brand'"
            [ "$code" = "206" ] || { echo "::error::$id$suffix: head range expected 206, got $code: $(body yt_small.bin)"; return 1; }
            [ "$size" = "1024" ] || { echo "::error::$id$suffix: head range returned $size bytes, expected 1024"; return 1; }
            # An audio response whose byte 4 is not `ftyp` is not an MP4/AAC
            # track and the TV plays it badly.
            if [ -n "$want_brand" ] && [ "$brand" != "$want_brand" ]; then
              echo "::error::$id$suffix: no $want_brand box at byte 4 (got '$brand') — not MP4"
              return 1
            fi

            half=$(( total / 2 ))
            end=$(( half + 1023 ))
            code=$(curl -s -o yt_mid.bin -w '%{http_code}' --max-time 180 \
              -u "$BASIC_AUTH" -H "Range: bytes=$half-$end" "$url")
            size=$(wc -c < yt_mid.bin)
            echo "  $id$suffix  range $half-$end -> HTTP $code, $size bytes"
            [ "$code" = "206" ] || { echo "::error::$id$suffix: mid-file range returned $code: $(body yt_mid.bin)"; return 1; }
            [ "$size" = "1024" ] || { echo "::error::$id$suffix: mid-file range returned $size bytes, expected 1024"; return 1; }
            return 0
          }

          fail=0
          # dQw4w9WgXcQ is an ordinary video, so it also proves the video
          # variant. The music ids are what the TV's music screen plays, and it
          # plays them as audio (`?audio=1`): their video variant is not a
          # product path and YouTube bot-checks it independently, so it is not
          # gated here. A client family YouTube decides to bot-check turns these
          # into 502s, which is a shipped-as-green regression until this gate
          # says otherwise.
          echo "video dQw4w9WgXcQ"
          check_stream dQw4w9WgXcQ '' '' || fail=1
          for id in dQw4w9WgXcQ kJQP7kiw5Fk zAiIgYOH4Ys BmRX2g6-iQI; do
            echo "audio $id"
            check_stream "$id" '?audio=1' ftyp || fail=1
          done
          [ "$fail" = "0" ] || exit 1
